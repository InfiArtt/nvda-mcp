# Publishes a release when a version tag such as v1.0.0 is pushed:
# the server goes to PyPI, the add-on to a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install the server with its development tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check the tag matches both versions
        shell: python
        run: |
          import configparser, os, sys, tomllib
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          server = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          manifest = configparser.ConfigParser()
          manifest.read_string("[m]\n" + open("addon/manifest.ini", encoding="utf-8").read())
          addon = manifest["m"]["version"].strip('"')
          if not tag == server == addon:
              sys.exit(f"Tag {tag}, pyproject.toml {server} and addon/manifest.ini {addon} must match.")

      - name: Lint and test
        run: |
          ruff check .
          ruff format --check .
          pytest

      - name: Build the add-on and the Python packages
        run: |
          python build_addon.py
          python -m build --outdir python-dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            dist/*.nvda-addon
            python-dist/*

  pypi:
    needs: build
    runs-on: ubuntu-latest
    # The PyPI project trusts this workflow in this environment; no token is stored anywhere.
    environment:
      name: pypi
      url: https://pypi.org/project/nvda-mcp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python-dist/

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: release-files

      - name: Create the GitHub release with the add-on
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The release notes are this version's section of CHANGELOG.md.
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {found=1; next} found && /^## \[/ {exit} found' \
            CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.nvda-addon \
            --title "NVDA MCP $version" --notes-file notes.md
