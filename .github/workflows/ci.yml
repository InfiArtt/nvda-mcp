# Checks every push to main and every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # The add-on calls Windows APIs, so the tests run on Windows.
    runs-on: windows-latest
    strategy:
      matrix:
        # The oldest version the server supports, and the one NVDA 2026 runs add-ons with.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the server with its development tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Run the tests
        run: pytest

      - name: Build the add-on
        run: python build_addon.py
