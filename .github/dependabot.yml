version: 2
updates:
  # Keeps the actions used by the workflows up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Keeps the server's dependencies in pyproject.toml up to date.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
