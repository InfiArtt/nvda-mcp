[project]
name = "nvda-mcp"
version = "1.0.0"
description = "MCP server that lets AI assistants work with the NVDA screen reader through the NVDA MCP add-on."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-2.0-or-later"
license-files = ["COPYING.txt", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "InfiArtt", email = "info@infiartt.com" }]
keywords = ["nvda", "screen reader", "accessibility", "mcp", "model context protocol", "ai assistant"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Adaptive Technologies",
    "Topic :: Software Development :: Testing",
]
dependencies = ["mcp>=2.3,<3", "httpx>=0.27", "websockets>=15"]

[project.urls]
Homepage = "https://github.com/InfiArtt/nvda-mcp"
Documentation = "https://github.com/InfiArtt/nvda-mcp/blob/main/docs/using.md"
Changelog = "https://github.com/InfiArtt/nvda-mcp/blob/main/CHANGELOG.md"
Issues = "https://github.com/InfiArtt/nvda-mcp/issues"
Donate = "https://paypal.me/rafli23115"

[project.scripts]
nvda-mcp = "nvda_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.16", "markdown>=3.5", "build>=1.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nvda_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/nvda_mcp", "README.md", "COPYING.txt", "THIRD_PARTY_NOTICES.md", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Downloaded reference documents must stay byte-for-byte as published.
extend-exclude = ["docs"]
line-length = 110
